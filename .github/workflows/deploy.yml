name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Check API key secret
        run: |
          if [ -z "$VITE_ANTHROPIC_KEY" ]; then
            echo "WARNING: VITE_ANTHROPIC_KEY is empty or not set"
          else
            echo "VITE_ANTHROPIC_KEY is set (length: ${#VITE_ANTHROPIC_KEY})"
            printf '%s' "$VITE_ANTHROPIC_KEY" | shasum -a 256 | cut -c1-16
          fi
        env:
          VITE_ANTHROPIC_KEY: ${{ secrets.VITE_ANTHROPIC_KEY }}
      - run: npm run build
        env:
          VITE_ANTHROPIC_KEY: ${{ secrets.VITE_ANTHROPIC_KEY }}
      - name: Verify key baked into bundle
        run: grep -rl "sk-ant-api03" dist/ && echo "Key IS in bundle" || echo "Key NOT in bundle"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
