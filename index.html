<!doctype html>
<html lang="en">

    <!-- Favicon: coffee cup SVG (scales perfectly at all sizes) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apple home screen icon: brand character -->
    <link rel="apple-touch-icon" href="/brand-character.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cafe Con Pan" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Primary SEO -->
    <title>Café Con Pan — Apple Tech Services for Small Businesses</title>
    <meta name="description" content="Apple-focused device management, carrier consulting, and business infrastructure for small businesses — built around an audit-first process. Serving the DMV and remote clients nationwide." />

    <link rel="canonical" href="https://pancon.cafe/" />

    <!-- Open Graph (social sharing: LinkedIn, Facebook, iMessage) -->
    <!-- Replace /og-image.png with your 1200×630 branded card when ready -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pancon.cafe/" />
    <meta property="og:site_name" content="Café Con Pan" />

    <meta property="og:description" content="Apple-focused device management, carrier consulting, and business infrastructure for small businesses — built around an audit-first process. Serving the DMV and remote clients nationwide." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Apple-focused device management, carrier consulting, and business infrastructure for small businesses — built around an audit-first process." />
    <meta name="twitter:image" content="https://pancon.cafe/og-image.png" />

    <style>input,select,textarea{font-size:16px}</style>
  </head>
